[task]
name = "afterquery/esterase-assay-workup"

[metadata]
author_name = "Inesh Reddy Chappidi"
author_email = "ineshhreddy249@gmail.com"

difficulty_explanation = """
An insectary runs a colorimetric esterase assay on 96-well plates and wants the
day's work-up, from the readers' raw exports to an activity per mosquito, as a
program. The note that ships (`/app/ASSAY.md`) gives the whole method: how
reads in absorbance, milli-absorbance or transmittance become optical density,
the least-squares rate per well, the blank correction, the standards' slope,
dilution and the Q10 correction to 25 C. Three past days ship as they came off
the readers, without figures. The program is marked on 12 days it never sees,
4720 mosquitoes, a line being right within 2 per cent; nine in ten must be.

Anyone who can code the six steps gets every line of a plate that went into the
reader the right way round. The difficulty is that on every day one or two
plates - 16 of the 59 marked plates - went in end for end. The reader
names wells by their place in its carriage, so on such a plate the export's B2
is the well the lay-out calls G11. The lay-out of ROLES is symmetric under that
half turn by the insectary's own design: blanks in the four corners, the
standards ladder running down column 1 and up column 12. So the blanks are
still blanks, every standard lands on a well holding its own amount, the
standard curve and the blank rate come out right, and nothing in the note's
arithmetic is disturbed. Only the mosquito identities move: every sample line
on a turned plate is some other mosquito's figure. The note's arithmetic
applied at face value gets 73% of lines, which is under the bar and
which the solver cannot see, because no figure ships to compare against.

What tells a turned plate from a straight one is not in any quantity the
work-up forms. Each sample carries `prep`: homogenates cleared in the
centrifuge are `spun`, those that came in from the field are `crude`, and they
sit on the plate in runs. A crude well's reads wander slowly about their line
where a spun well's scatter; the spread about the fitted line is the same for
both (the bench scales it so), as are rate, level and first read. The
difference is in how successive departures follow one another - the lag-one
correlation of the residuals, a second-order property of the noise the method
never looks at. Where the wandering wells sit according to the lay-out, or
according to the lay-out turned round, is what says which way the plate went in.
An expert who has loaded plates into readers knows this happens and checks for
it; a program written from the note alone does not.

What the natural first-order checks score on the marked days, by the same
marking, so the bar can be seen to separate the right account from every other:

    the reference (notes the wander, judges each plate)   100%
    the note's arithmetic, lay-out believed                73%
    plate judged by the crude wells' spread about the line 60%
    plate judged by the crude wells' rate                  45%
    plate judged by the crude wells' level                 47%
    every plate taken as turned                            28%
    the bar                                                90%

tests/accounts.py measures that table on the marked days.
"""

solution_explanation = """
solution/activities.py is plain Python, about a hundred lines. For each plate
it fits every well's optical density against time, then for every well takes
how far the departures from that line carry over from one read to the next.
It works out the mean carry-over of the wells the lay-out calls crude less
that of the wells it calls spun, once for the lay-out as written and once for
the lay-out turned end for end, and takes the plate to have gone in whichever
way round puts the wandering wells under the crude labels. The rest is the
note's six steps with the well names mapped through that turn. It scores
4720 of 4720 on the marked days and misjudges 0 plates.
"""

verification_explanation = """
tests/marking.py rebuilds the 12 marked days in the verifier from seeds that
never ship, with the same bench model (tests/bench.py) that made the three past
days, so it knows which plates it turned. The true figure for a mosquito is the
note's arithmetic applied to its plate read the way round the plate really
went in. The agent's `/app/activities.py` is copied into an empty directory
and run there as `nobody` with a bare environment, one day at a time on
standard input, with a two-minute limit a day; /tests and /logs/verifier are
root's alone, so the program can read neither the bench nor the reward. A line
is right within 2 per cent (with a floor of 0.05 for figures near zero); the
reward is 1 when at least 4248 of the 4720 lines are right and 0 otherwise. A
crash, a hang, or a missing line all count against the bar, and the reward
file is written as 0 before anything runs. The reference scores 4720 and
an empty container 0; cheat/literal.py, the note's arithmetic alone, scores
73%.
"""

